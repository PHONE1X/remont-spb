<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заявка принята — мастер по ремонту ноутбуков и ПК, СПб</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0f14;--panel:#121922;--line:#1e2a38;--text:#e8eef7;--muted:#8fa2b8;--acc:#3ea6ff;--acc2:#25d07a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:38px 30px;max-width:520px;text-align:center}
.ok{width:64px;height:64px;border-radius:50%;background:rgba(37,208,122,.14);display:grid;place-items:center;margin:0 auto 20px;font-size:30px}
h1{font-size:24px;margin-bottom:12px;letter-spacing:-.02em}
p{color:var(--muted);font-size:16px;line-height:1.6}
.btn{display:inline-block;margin-top:24px;padding:14px 26px;border-radius:12px;background:linear-gradient(135deg,#2bd67b,#1aa860);color:#04120a;font-weight:800;text-decoration:none}
.tel{display:block;margin-top:16px;color:var(--acc);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="ok">✓</div>
  <h1>Заявка принята</h1>
  <p>Перезвоню в течение 15 минут в рабочее время (ежедневно с 09:00 до 21:00). Если срочно — звоните сами, отвечу сразу.</p>
  <a class="btn" href="tel:+79523658031">Позвонить мастеру</a>
  <a class="tel" href="tel:+79523658031">+7 952 365-80-31</a>
  <p style="margin-top:22px;font-size:14px"><a href="/" style="color:#8fa2b8">← На главную</a></p>
</div>
</body>
</html>
